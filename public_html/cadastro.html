<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - TransKwanza</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .social-divider {
            text-align: center;
            margin: 25px 0;
            position: relative;
        }

        .social-divider::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 1px;
            background: #e0e0e0;
        }

        .social-divider span {
            background: white;
            padding: 0 15px;
            position: relative;
            color: #666;
            font-size: 0.9rem;
        }

        .social-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
        }

        .social-btn:hover {
            border-color: #667eea;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .social-btn.google:hover {
            border-color: #4285f4;
        }

        .social-btn.facebook {
            background: #1877f2;
            color: white;
            border-color: #1877f2;
        }

        .social-btn.facebook:hover {
            background: #165ecc;
            border-color: #165ecc;
        }

        #googleSignInBtn {
            display: flex;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header-simple">
            <a href="index.html" class="logo">🌍 TransKwanza</a>
        </header>

        <main class="main-content">
            <div class="card auth-card">
                <h2>Criar Conta</h2>
                <p class="subtitle">Comece a usar TransKwanza hoje</p>

                <!-- Cadastro Social -->
                <div class="social-buttons">
                    <div id="googleSignInBtn" class="social-btn google"></div>
                    <button type="button" id="facebookLoginBtn" class="social-btn facebook">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                        </svg>
                        Continuar com Facebook
                    </button>
                </div>

                <div class="social-divider">
                    <span>ou cadastre-se com email</span>
                </div>

                <form id="registerForm">
                    <div class="form-group">
                        <label for="name">Nome Completo</label>
                        <input type="text" id="name" name="name" required placeholder="Seu nome">
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required placeholder="seu@email.com">
                    </div>

                    <div class="form-group">
                        <label for="password">Senha</label>
                        <input type="password" id="password" name="password" required placeholder="Mínimo 6 caracteres">
                    </div>

                    <div class="form-group">
                        <label for="country">País</label>
                        <select id="country" name="country" required>
                            <option value="">Selecione seu país</option>
                            <option value="Brasil">🇧🇷 Brasil</option>
                            <option value="Angola">🇦🇴 Angola</option>
                            <option value="Portugal">🇵🇹 Portugal</option>
                            <option value="Estados Unidos">🇺🇸 Estados Unidos</option>
                            <option value="Cuba">🇨🇺 Cuba</option>
                            <option value="Rússia">🇷🇺 Rússia</option>
                            <option value="África do Sul">🇿🇦 África do Sul</option>
                            <option value="Namíbia">🇳🇦 Namíbia</option>
                            <option value="Moçambique">🇲🇿 Moçambique</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block">Criar Conta</button>

                    <p class="text-center mt-20">
                        Já tem conta? <a href="login.html">Entrar</a>
                    </p>
                </form>

                <div id="message" class="message"></div>
            </div>
        </main>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/social-login.js"></script>
</body>
</html>
