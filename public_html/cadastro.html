<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - TransKwanza</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script async defer crossorigin="anonymous" src="https://connect.facebook.net/pt_BR/sdk.js"></script>
    <script src="https://appleid.cdn-apple.com/appleauth/static/jsapi/appleid/1/pt_BR/appleid.auth.js"></script>
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card glass-card">
            <div class="auth-header">
                <a href="index.html" class="logo">
                    <i class="fas fa-exchange-alt"></i>
                    <span>TransKwanza</span>
                </a>
                <h1>Criar Conta</h1>
                <p>Comece a enviar dinheiro hoje</p>
            </div>

            <!-- Cadastro Tradicional -->
            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label for="name">Nome Completo</label>
                    <div class="input-group">
                        <i class="fas fa-user"></i>
                        <input type="text" id="name" name="name" placeholder="João Silva" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <div class="input-group">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" name="email" placeholder="seu@email.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="phone">Telefone</label>
                    <div class="input-group">
                        <i class="fas fa-phone"></i>
                        <input type="tel" id="phone" name="phone" placeholder="+55 11 99999-9999">
                    </div>
                </div>

                <div class="form-group">
                    <label for="country">País</label>
                    <div class="input-group">
                        <i class="fas fa-globe"></i>
                        <select id="country" name="country" required>
                            <option value="">Selecione seu país</option>
                            <option value="BR">🇧🇷 Brasil</option>
                            <option value="AO">🇦🇴 Angola</option>
                            <option value="PT">🇵🇹 Portugal</option>
                            <option value="US">🇺🇸 Estados Unidos</option>
                            <option value="CU">🇨🇺 Cuba</option>
                            <option value="RU">🇷🇺 Rússia</option>
                            <option value="ZA">🇿🇦 África do Sul</option>
                            <option value="NA">🇳🇦 Namíbia</option>
                            <option value="MZ">🇲🇿 Moçambique</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Senha</label>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" name="password" placeholder="Mínimo 6 caracteres" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirmar Senha</label>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Digite novamente" required>
                    </div>
                </div>

                <button type="submit" class="btn-primary btn-block">
                    <i class="fas fa-user-plus"></i>
                    Criar Conta
                </button>
            </form>

            <div class="divider">
                <span>OU</span>
            </div>

            <div class="social-login">
                <button id="googleLoginBtn" class="btn-social btn-google">
                    <i class="fab fa-google"></i>
                    Cadastrar com Google
                </button>

                <button id="facebookLoginBtn" class="btn-social btn-facebook">
                    <i class="fab fa-facebook-f"></i>
                    Cadastrar com Facebook
                </button>

                <button id="instagramLoginBtn" class="btn-social btn-instagram">
                    <i class="fab fa-instagram"></i>
                    Cadastrar com Instagram
                </button>

                <button id="appleLoginBtn" class="btn-social btn-apple">
                    <i class="fab fa-apple"></i>
                    Cadastrar com Apple
                </button>
            </div>

            <div class="auth-footer">
                <p>Já tem uma conta? <a href="login.html">Faça Login</a></p>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script src="js/social-login.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
