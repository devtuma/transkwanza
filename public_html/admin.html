<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - TransKwanza</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body class="dashboard-page">
    <div class="container">
        <!-- Header -->
        <div class="dashboard-header glass-card">
            <div class="user-info">
                <div class="user-avatar" style="background: #e74c3c;"><i class="fas fa-user-shield"></i></div>
                <div class="user-details">
                    <h2>Painel Administrativo</h2>
                    <p id="adminEmail"></p>
                </div>
            </div>
            <div>
                <a href="dashboard.html" class="btn-secondary" style="margin-right: 1rem;">
                    <i class="fas fa-home"></i> Dashboard
                </a>
                <button id="logoutBtn" class="btn-secondary">
                    <i class="fas fa-sign-out-alt"></i> Sair
                </button>
            </div>
        </div>

        <!-- Stats -->
        <div class="dashboard-grid">
            <div class="dashboard-card glass-card">
                <h3><i class="fas fa-users"></i> Usuários</h3>
                <p style="font-size: 2rem; font-weight: bold; margin: 0.5rem 0;" id="totalUsers">0</p>
                <p style="color: rgba(255,255,255,0.6); font-size: 0.9rem;"><span id="verifiedUsers">0</span> verificados</p>
            </div>

            <div class="dashboard-card glass-card">
                <h3><i class="fas fa-id-card"></i> KYC Pendente</h3>
                <p style="font-size: 2rem; font-weight: bold; color: #f39c12; margin: 0.5rem 0;" id="pendingKYC">0</p>
                <p style="color: rgba(255,255,255,0.6); font-size: 0.9rem;">Aguardando análise</p>
            </div>

            <div class="dashboard-card glass-card">
                <h3><i class="fas fa-clock"></i> Transações Pendentes</h3>
                <p style="font-size: 2rem; font-weight: bold; color: #3498db; margin: 0.5rem 0;" id="pendingTransactions">0</p>
                <p style="color: rgba(255,255,255,0.6); font-size: 0.9rem;">Aguardando aprovação</p>
            </div>

            <div class="dashboard-card glass-card">
                <h3><i class="fas fa-exclamation-triangle"></i> Alertas de Fraude</h3>
                <p style="font-size: 2rem; font-weight: bold; color: #e74c3c; margin: 0.5rem 0;" id="fraudAlerts">0</p>
                <p style="color: rgba(255,255,255,0.6); font-size: 0.9rem;">Não resolvidos</p>
            </div>
        </div>

        <!-- Tabs -->
        <div class="dashboard-card glass-card" style="margin-top: 2rem;">
            <div class="tabs">
                <button class="tab active" data-tab="kyc"><i class="fas fa-id-card"></i> KYC</button>
                <button class="tab" data-tab="transactions"><i class="fas fa-exchange-alt"></i> Transações</button>
                <button class="tab" data-tab="currencies"><i class="fas fa-money-bill"></i> Moedas</button>
                <button class="tab" data-tab="fraud"><i class="fas fa-shield-alt"></i> Fraude</button>
            </div>

            <!-- KYC Tab -->
            <div id="tab-kyc" class="tab-content active">
                <h3>KYC Pendentes de Aprovação</h3>
                <div id="kycList"></div>
            </div>

            <!-- Transactions Tab -->
            <div id="tab-transactions" class="tab-content">
                <h3>Transações Aguardando Aprovação</h3>
                <div id="transactionsList"></div>
            </div>

            <!-- Currencies Tab -->
            <div id="tab-currencies" class="tab-content">
                <h3>Gerenciar Moedas</h3>
                <div id="currenciesList"></div>
            </div>

            <!-- Fraud Tab -->
            <div id="tab-fraud" class="tab-content">
                <h3>Alertas de Fraude</h3>
                <div id="fraudList"></div>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
