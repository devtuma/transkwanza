<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - TransKwanza</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header class="header-dashboard">
            <div class="logo">🌍 TransKwanza</div>
            <button id="logoutBtn" class="btn btn-small">Sair</button>
        </header>

        <main class="main-content">
            <div class="card">
                <h2>Bem-vindo, <span id="userName">Usuário</span>!</h2>
                <p class="subtitle">Sua conta foi criada com sucesso.</p>

                <div class="user-info">
                    <p><strong>Email:</strong> <span id="userEmail"></span></p>
                    <p><strong>País:</strong> <span id="userCountry"></span></p>
                </div>

                <div class="alert alert-info">
                    <strong>🎉 Fase 1 Completa!</strong>
                    <p>Sistema de autenticação funcionando perfeitamente.</p>
                    <p><small>Próxima fase: Sistema KYC com upload de documentos</small></p>
                </div>
            </div>
        </main>
    </div>

    <script src="js/auth.js"></script>
    <script>
        // Carregar dados do usuário
        const user = JSON.parse(localStorage.getItem('user') || '{}');

        if (!user.id) {
            window.location.href = 'login.html';
        } else {
            document.getElementById('userName').textContent = user.name;
            document.getElementById('userEmail').textContent = user.email;
            document.getElementById('userCountry').textContent = user.country;
        }

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('user');
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
